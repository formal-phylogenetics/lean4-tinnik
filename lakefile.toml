name = "TINNiK"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
description = "A Lean 4 formalization of TINNiK (Allman, Baños, Mitchell, Rhodes 2024)"
defaultTargets = ["TINNiK"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "4daee158d74436ce6ed6f52e337ba00f1b43ea32"

# The hub of the tree-of-blobs papers: what they share.
[[require]]
name = "TreeOfBlobs"
git = "https://github.com/vltanh/lean4-tob"
rev = "b2dadbda0c992091dd6e9105e1394c5b7557602c"

# Allman, Baños, Mitchell, Rhodes 2023, whose results this paper uses.
[[require]]
name = "AllmanEtAl2023"
git = "https://github.com/vltanh/lean4-allman2023"
rev = "0fe8983a52c3811a8cf0ab99f3f90ff66f6a2937"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

# Every module of this repository is under TINNiK/ (lean4-phylogenetics, docs/CONVENTIONS.md).
[[lean_lib]]
name = "TINNiK"
globs = ["TINNiK.+"]
